name: yafva — Publish to GitHub Packages

# Publishes the fork's Maven artifacts (org.hl7.fhir.utilities, .r4, .r5,
# .validation, ...) to maven.pkg.github.com/Outburn-IL/org.hl7.fhir.core.
#
# Trigger by pushing a tag matching v*-yafva.* (e.g. v6.9.8-yafva.1) or
# manually via workflow_dispatch with an explicit version.
#
# Manual sync from upstream is documented in SYNC.md.

on:
  push:
    tags:
      - 'v*-yafva.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 6.9.8-yafva.1)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github-yafva
          server-username: GITHUB_ACTOR_ENV
          server-password: GITHUB_TOKEN_ENV

      - name: Set project version
        run: |
          ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Deploy all modules
        env:
          GITHUB_ACTOR_ENV: ${{ github.actor }}
          GITHUB_TOKEN_ENV: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -ntp -DskipTests -DdeployToYafva deploy
